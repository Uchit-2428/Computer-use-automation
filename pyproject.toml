[project]
name = "cua-automation"
version = "0.1.0"
description = "Computer-use automation: LLM discovery -> reviewable capability artifact -> deterministic replay, with guardrails and human handoff."
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.45",
  "pydantic>=2.6",
  "aiohttp>=3.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cua = "cua.cli:main"

[tool.setuptools]
packages = ["cua", "cua.surface", "mockapp"]

[tool.setuptools.package-data]
"cua.surface" = ["resolver.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
